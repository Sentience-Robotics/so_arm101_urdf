version: 1
robot_name: so_arm101
generated_files:
  ros2_control_xacro: so_arm101_ros2_control.xacro
  controllers_yaml: controllers.yaml
passive_urdf_joints: []
ignore_urdf_joints: []

cameras: []

firmware:
  source_dir: micro_ros_raspberrypi_pico_sdk
  build_dir: build

controller_manager:
  update_rate: 100

boards:
  rp2040_so_arm:
    serial_id: ''
    board_class: bus_servo_only
    internal_servo_slots: 6
    firmware_target: pico_micro_ros_so_arm
    compile_definition: USE_SO_ARM
    topic_actuators: actuators/so_arm
    topic_sensors: sensors/so_arm
    controller:
      name: so_arm_controller
      type: joint_trajectory_controller/JointTrajectoryController

actuators:
# Servo degrees on the firmware scale: 0-360 deg maps onto the STS3215
# 0-4096 tick span (BusServoConfig in firmwares/rp2040), so deg = ticks * 360/4096.
# Windows are the recorded LeRobot follower calibration; offset_deg 180 is the homed
# centre (2048 ticks), which the calibration puts at joint zero.
  # STS3215 smart bus servos. servo_type is the PWM-family field the schema still
  # requires; the generated xacro drives them through the bus_servo path.
  - id: rotation
    urdf_joint: Rotation
    board: rp2040_so_arm
    virtual_pin: 0
    physical_pin: 1
    servo_type: '300'
    offset_deg: 180
    direction: 1
    scale: 1
    servo_min_deg: 62.31
    servo_max_deg: 283.8
    servo_default_deg: 180
    enabled: true
  - id: pitch
    urdf_joint: Pitch
    board: rp2040_so_arm
    virtual_pin: 1
    physical_pin: 2
    servo_type: '300'
    offset_deg: 180
    direction: 1
    scale: 1
    servo_min_deg: 73.65
    servo_max_deg: 282.13
    servo_default_deg: 180
    enabled: true

  - id: elbow
    urdf_joint: Elbow
    board: rp2040_so_arm
    virtual_pin: 2
    physical_pin: 3
    servo_type: '300'
    offset_deg: 180
    direction: 1
    scale: 1
    servo_min_deg: 74.27
    servo_max_deg: 271.14
    servo_default_deg: 180
    enabled: true
  - id: wrist_pitch
    urdf_joint: Wrist_Pitch
    board: rp2040_so_arm
    virtual_pin: 3
    physical_pin: 4
    servo_type: '300'
    offset_deg: 180
    direction: 1
    scale: 1
    servo_min_deg: 70.14
    servo_max_deg: 279.76
    servo_default_deg: 180
    enabled: true
  - id: wrist_roll
    urdf_joint: Wrist_Roll
    board: rp2040_so_arm
    virtual_pin: 4
    physical_pin: 5
    servo_type: '300'
    offset_deg: 180
    direction: 1
    scale: 1
    servo_min_deg: 0
    servo_max_deg: 359.91
    servo_default_deg: 180
    enabled: true
  - id: jaw
    urdf_joint: Jaw
    board: rp2040_so_arm
    virtual_pin: 5
    physical_pin: 6
    servo_type: '300'
    offset_deg: 180
    direction: 1
    scale: 1
    servo_min_deg: 178.68
    servo_max_deg: 309.81
    servo_default_deg: 180
    enabled: true

sensors:
  # Magnetic encoder feedback placeholders (STS3215 Present_Position, 4096 ticks/rev).
  # Lucy firmware currently publishes pressure-style sensors only; keep disabled until
  # bus-servo encoder reading is implemented. Schema still requires virtual/physical pins.
  - id: rotation_encoder
    type: encoder
    associated_actuator: rotation
    board: rp2040_so_arm
    virtual_pin: 0
    physical_pin: 1
    min_value: 62.31
    max_value: 283.8
    enabled: false
  - id: pitch_encoder
    type: encoder
    associated_actuator: pitch
    board: rp2040_so_arm
    virtual_pin: 1
    physical_pin: 2
    min_value: 73.65
    max_value: 282.13
    enabled: false
  - id: elbow_encoder
    type: encoder
    associated_actuator: elbow
    board: rp2040_so_arm
    virtual_pin: 2
    physical_pin: 3
    min_value: 74.27
    max_value: 271.14
    enabled: false

  - id: wrist_pitch_encoder
    type: encoder
    associated_actuator: wrist_pitch
    board: rp2040_so_arm
    virtual_pin: 3
    physical_pin: 4
    min_value: 70.14
    max_value: 279.76
    enabled: false
  - id: wrist_roll_encoder
    type: encoder
    associated_actuator: wrist_roll
    board: rp2040_so_arm
    virtual_pin: 4
    physical_pin: 5
    min_value: 0
    max_value: 359.91
    enabled: false
  - id: jaw_encoder
    type: encoder
    associated_actuator: jaw
    board: rp2040_so_arm
    virtual_pin: 5
    physical_pin: 6
    min_value: 178.68
    max_value: 309.81
    enabled: false
