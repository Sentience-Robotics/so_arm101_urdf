version: 1
robot_name: so_arm101
generated_files:
  ros2_control_xacro: so_arm101_ros2_control.xacro
  controllers_yaml: controllers.yaml
passive_urdf_joints: []
ignore_urdf_joints: []

cameras: []

firmware:
  source_dir: micro_ros_raspberrypi_pico_sdk
  build_dir: build

controller_manager:
  update_rate: 100

boards:
  rp2040_so_arm:
    serial_id: ''
    board_class: internal_servo_only
    internal_servo_slots: 6
    firmware_target: pico_micro_ros_so_arm
    compile_definition: USE_SO_ARM
    topic_actuators: actuators/so_arm
    topic_sensors: sensors/so_arm
    controller:
      name: so_arm_controller
      type: joint_trajectory_controller/JointTrajectoryController

actuators:
# offset_deg is the servo angle at joint zero; these are window midpoints, not measured.
  # STS3215 smart bus servos — mapped to Lucy PWM schema (servo_type 300) until
  # bus-servo hardware support lands. Negative min degrees match URDF joint span.
  - id: rotation
    urdf_joint: Rotation
    board: rp2040_so_arm
    virtual_pin: 0
    physical_pin: 1
    servo_type: '300'
    offset_deg: 200
    direction: 1
    scale: 1
    servo_min_deg: 80
    servo_max_deg: 320
    servo_default_deg: 200
    enabled: true
  - id: pitch
    urdf_joint: Pitch
    board: rp2040_so_arm
    virtual_pin: 1
    physical_pin: 2
    servo_type: '300'
    offset_deg: 182.5
    direction: 1
    scale: 1
    servo_min_deg: 75
    servo_max_deg: 290
    servo_default_deg: 182.5
    enabled: true

  - id: elbow
    urdf_joint: Elbow
    board: rp2040_so_arm
    virtual_pin: 2
    physical_pin: 3
    servo_type: '300'
    offset_deg: 207.5
    direction: 1
    scale: 1
    servo_min_deg: 140
    servo_max_deg: 275
    servo_default_deg: 207.5
    enabled: true
  - id: wrist_pitch
    urdf_joint: Wrist_Pitch
    board: rp2040_so_arm
    virtual_pin: 3
    physical_pin: 4
    servo_type: '300'
    offset_deg: 177.5
    direction: 1
    scale: 1
    servo_min_deg: 74
    servo_max_deg: 281
    servo_default_deg: 177.5
    enabled: true
  - id: wrist_roll
    urdf_joint: Wrist_Roll
    board: rp2040_so_arm
    virtual_pin: 4
    physical_pin: 5
    servo_type: '300'
    offset_deg: 90
    direction: 1
    scale: 1
    servo_min_deg: 0
    servo_max_deg: 360
    servo_default_deg: 180
    enabled: true
  - id: jaw
    urdf_joint: Jaw
    board: rp2040_so_arm
    virtual_pin: 5
    physical_pin: 6
    servo_type: '300'
    offset_deg: 137.5
    direction: 1
    scale: 1
    servo_min_deg: 115
    servo_max_deg: 250
    servo_default_deg: 137.5
    enabled: true

sensors:
  # Magnetic encoder feedback placeholders (STS3215 Present_Position, 4096 ticks/rev).
  # Lucy firmware currently publishes pressure-style sensors only; keep disabled until
  # bus-servo encoder reading is implemented. Schema still requires virtual/physical pins.
  - id: rotation_encoder
    type: encoder
    associated_actuator: rotation
    board: rp2040_so_arm
    virtual_pin: 0
    physical_pin: 1
    min_value: 80
    max_value: 320
    enabled: false
  - id: pitch_encoder
    type: encoder
    associated_actuator: pitch
    board: rp2040_so_arm
    virtual_pin: 1
    physical_pin: 2
    min_value: 75
    max_value: 290
    enabled: false
  - id: elbow_encoder
    type: encoder
    associated_actuator: elbow
    board: rp2040_so_arm
    virtual_pin: 2
    physical_pin: 3
    min_value: 140
    max_value: 275
    enabled: false

  - id: wrist_pitch_encoder
    type: encoder
    associated_actuator: wrist_pitch
    board: rp2040_so_arm
    virtual_pin: 3
    physical_pin: 4
    min_value: 74
    max_value: 281
    enabled: false
  - id: wrist_roll_encoder
    type: encoder
    associated_actuator: wrist_roll
    board: rp2040_so_arm
    virtual_pin: 4
    physical_pin: 5
    min_value: 0
    max_value: 360
    enabled: false
  - id: jaw_encoder
    type: encoder
    associated_actuator: jaw
    board: rp2040_so_arm
    virtual_pin: 5
    physical_pin: 6
    min_value: 115
    max_value: 250
    enabled: false
